    <div *ngIf="logo$ | async">
    <div class="imgDiv">
      <img class="img" [src]="image" alt="Daytime Logo">
    </div>
    <div class="titleDiv">
      <h1>Dusk & Dawn</h1>
    </div>

    <form [formGroup]="formLogin">
    <div class="inputDiv">
      <input type="text" placeholder="Username" formControlName="username"/>
    </div>

    <div class="inputDiv">
      <input type="password" placeholder="Password" formControlName="password">
    </div>

    <div class="butDiv">
      <button mat-raised-button class="but" [disabled]="formLogin.invalid" (click)="loginUser()">Log In</button>   
    </div>
  </form>

    <div class="signDiv">
      <button (click)="signup()" class="signBut" mat-button><p class="p">Don't have an account? Sign up</p></button>
    </div>
</div>
